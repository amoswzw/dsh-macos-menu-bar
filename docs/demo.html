<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH macOS Menu Bar · desktop placement demo</title>
<style>
  * { box-sizing: border-box }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden }
  body { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #f5f8ff;
    background: radial-gradient(ellipse at 65% 115%, #3865a7 0, #173c75 29%, transparent 57%),
      radial-gradient(ellipse at 20% 10%, #224773 0, transparent 60%), #0b1830 }
  .glow { position: absolute; inset: 0; background: linear-gradient(145deg, #ffffff11, transparent 42%); pointer-events: none }
  .desktop-bar { position: absolute; z-index: 5; top: 0; left: 0; width: 100%; height: 54px;
    background: #171b25eb; border-bottom: 1px solid #ffffff1f; box-shadow: 0 5px 18px #0003 }
  .desktop-bar .left { position: absolute; left: 28px; top: 16px; font-size: 15px; font-weight: 600 }
  .desktop-bar .left span { margin-left: 20px; color: #d5ddeb; font-weight: 400 }
  .desktop-bar .right { position: absolute; right: 30px; top: 16px; color: #d5ddeb; font-size: 14px }
  .scene { position: absolute; inset: 0; opacity: 0; pointer-events: none }
  .island { position: absolute; z-index: 7; top: 0; left: 50%; transform: translateX(-50%); width: 336px; height: 60px;
    clip-path: inset(0 6% 35% 6% round 0 0 22px 22px) }
  .cursor { position: absolute; z-index: 8; top: 24px; left: 676px; width: 20px; height: 26px;
    background: #f7fbff; clip-path: polygon(0 0, 0 100%, 6px 17px, 18px 19px); filter: drop-shadow(1px 2px 1px #000) }
  .dsh-window { position: absolute; left: 235px; top: 79px; width: 810px; height: 470px;
    border: 1px solid #ffffff45; border-radius: 14px; background: #111; overflow: hidden;
    box-shadow: 0 24px 70px #000b }
  .titlebar { height: 37px; background: #242a34; color: #d3ddec; font-size: 12px;
    text-align: center; padding-top: 11px; border-bottom: 1px solid #ffffff1a }
  .traffic { position: absolute; left: 15px; top: 14px; display: flex; gap: 6px }
  .traffic i { width: 9px; height: 9px; border-radius: 50%; background: #ff605c }
  .traffic i:nth-child(2) { background: #ffbd44 }.traffic i:nth-child(3) { background: #00ca4e }
  .dsh-window img { display: block; width: 100%; height: auto }
  .approval { position: absolute; z-index: 8; top: 0; left: 50%; width: 900px; height: 49px;
    transform: translateX(-50%); object-fit: fill; filter: drop-shadow(0 7px 12px #0008) }
  .zoom { position: absolute; left: 90px; top: 166px; right: 90px; height: 152px;
    background: #10151eea; border: 1px solid #ffffff30; border-radius: 22px;
    box-shadow: 0 22px 55px #0007; padding: 18px 24px }
  .zoom b { display: block; color: #89bcff; font-size: 13px; letter-spacing: .1em; margin-bottom: 13px }
  .zoom img { width: 100%; height: auto; display: block }
  .settings-window { position: absolute; left: 110px; top: 76px; width: 1060px; height: 540px;
    border: 1px solid #ffffff42; border-radius: 14px; background: #111; overflow: hidden;
    box-shadow: 0 24px 70px #000b }
  .settings-window img { display: block; width: 100%; height: auto }
  .caption { position: absolute; z-index: 3; left: 65px; right: 65px; bottom: 31px; min-height: 112px;
    border-radius: 18px; border: 1px solid #b3ccf338; background: #0c1425d9;
    backdrop-filter: blur(12px); box-shadow: 0 16px 40px #0005; padding: 19px 24px }
  .caption h2 { margin: 0 0 6px; font-size: 24px; font-weight: 720 }
  .caption p { margin: 0; color: #b6c5de; font-size: 15px }
  .caption small { position: absolute; right: 24px; bottom: 21px; color: #9aabca; font-size: 12px }
  .steps { position: absolute; z-index: 10; right: 91px; bottom: 15px; display: flex; gap: 6px }
  .steps i { width: 24px; height: 4px; border-radius: 4px; background: #6d84a56e }
  .steps i.on { background: #6facff; box-shadow: 0 0 11px #6facff88 }
</style>
<div class="glow"></div>
<div class="desktop-bar"><div class="left">● <span>Finder</span><span>文件</span><span>编辑</span></div><div class="right">◉　◈　▰　11:52</div></div>
<section class="scene" id="scene0">
  <img class="island" src="screenshots/island-idle.png" alt="刘海上的状态岛">
  <div class="cursor" id="cursor"></div>
  <div class="dsh-window" id="popup"><div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div>DeepSeek Harness · 菜单栏与灵动岛</div><img src="screenshots/settings.png" alt="DSH 设置页面"></div>
  <div class="caption"><h2>桌面顶端的刘海入口</h2><p>鼠标移到刘海区域，DSH 的现有窗口从菜单栏下方弹出。</p><small>界面位置示意 · 配置页为示例内容</small></div>
</section>
<section class="scene" id="scene1">
  <img class="approval" src="screenshots/approval-compact.png" alt="菜单栏内的紧凑审批卡片">
  <div class="zoom"><b>菜单栏审批卡片 · 局部放大</b><img src="screenshots/approval-compact.png" alt="审批卡片放大"></div>
  <div class="caption"><h2>审批直接显示在菜单栏与刘海附近</h2><p>紧凑模式保持在菜单栏范围内；可以查看详情后再决定。</p><small>审批画面为预览，不会授权任务</small></div>
</section>
<section class="scene" id="scene2">
  <img class="island" src="screenshots/island-idle.png" alt="刘海上的状态岛">
  <div class="settings-window"><div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div>DeepSeek Harness · 插件设置</div><img id="settings-image" src="screenshots/settings.png" alt="菜单栏与灵动岛配置页"></div>
  <div class="caption"><h2>在 DSH 中设置入口和审批样式</h2><p>窗口尺寸、悬停、自动收起及语言自动保存。</p><small>配置页截图</small></div>
</section>
<div class="steps"><i></i><i></i><i></i></div>
<script>
  const scenes = [...document.querySelectorAll('.scene')]
  const steps = [...document.querySelectorAll('.steps i')]
  const clamp = n => Math.max(0, Math.min(1, n))
  function setDemoTime(time) {
    const t = ((time % 12) + 12) % 12
    scenes.forEach((scene, index) => {
      const local = t - index * 4
      const alpha = clamp(local / .45) * clamp((4 - local) / .45)
      scene.style.opacity = alpha
      steps[index].classList.toggle('on', local >= 0 && local < 4)
    })
    const appear = clamp((t - 1) / .55)
    const popup = document.getElementById('popup')
    popup.style.opacity = appear
    popup.style.transform = `translateY(${(1 - appear) * -22}px) scale(${.98 + .02 * appear})`
    document.getElementById('cursor').style.transform = `translateY(${Math.sin(t * 2.2) * 4}px)`
    document.getElementById('settings-image').style.transform = `translateY(${-clamp((t - 8.8) / 2.3) * 125}px)`
  }
  window.setDemoTime = setDemoTime
  setDemoTime(0.2)
</script>
</html>
