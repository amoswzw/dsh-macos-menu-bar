<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>菜单栏与灵动岛设置</title>
<style>
  :root{color-scheme:light dark;font:14px -apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,3vw,32px);background:transparent;color:CanvasText}.wrap{max-width:900px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5;color:GrayText;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.card{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:14px;padding:18px;background:color-mix(in srgb,Canvas 88%,transparent)}.card h2{font-size:16px;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0}.row span{line-height:1.4}.row input[type=number]{width:100px;max-width:45%;padding:7px;border-radius:8px;border:1px solid GrayText;background:Canvas;color:CanvasText}.row input[type=checkbox]{width:18px;height:18px;flex:none}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}button{font:inherit;border:0;border-radius:9px;padding:9px 16px;background:#1974dd;color:#fff;cursor:pointer}button:disabled{opacity:.5}#status{color:GrayText}
</style>
<div class="wrap"><h1 data-i18n="heading">菜单栏与灵动岛</h1><p data-i18n="intro">尺寸使用 macOS 逻辑点，弹窗会限制在屏幕可用区域内。内建屏幕的刘海尺寸由 macOS 读取；没有刘海的旧款 MacBook 会在菜单栏下方显示浮动岛。原生面板不可用时保留菜单栏入口。</p>
<div class="grid"><section class="card"><h2 data-i18n="window">窗口</h2><label class="row"><span data-i18n="maxWidth">最大宽度</span><input name="maxWidth" type="number" min="680" max="1800" step="1"></label><label class="row"><span data-i18n="maxHeight">最大高度</span><input name="maxHeight" type="number" min="600" max="1200" step="1"></label><label class="row"><span data-i18n="hideOnBlur">失焦时收起</span><input name="hideOnBlur" type="checkbox"></label><label class="row"><span data-i18n="hideOnMouseLeave">鼠标离开窗口时收起</span><input name="hideOnMouseLeave" type="checkbox"></label></section>
<section class="card"><h2 data-i18n="island">灵动岛</h2><label class="row"><span data-i18n="notchHover">鼠标移到刘海时打开 DSH 主窗口</span><input name="notchHover" type="checkbox"></label><label class="row"><span data-i18n="notchApprovals">审批以灵动岛卡片显示</span><input name="notchApprovals" type="checkbox"></label><label class="row"><span data-i18n="compactApprovals">审批卡片保持在菜单栏内</span><input name="compactApprovals" type="checkbox"></label><label class="row"><span data-i18n="hideTrayIcon">隐藏菜单栏图标（需开启悬停入口）</span><input name="hideTrayIcon" type="checkbox"></label></section></div>
<div class="actions"><label class="row"><span data-i18n="language">语言</span><select name="language"><option value="auto" data-i18n="auto">跟随系统</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><button id="reset" type="button" disabled data-i18n="reset">恢复默认</button><button id="preview" type="button" data-i18n="preview">预览审批弹窗</button><span id="status" role="status" aria-live="polite">读取设置中…</span></div></div>
<script>
const defaults = { maxWidth: 1120, maxHeight: 850, hideOnBlur: true, hideOnMouseLeave: true,
  notchHover: false, notchApprovals: false, compactApprovals: false, hideTrayIcon: false, language: 'auto' }
const strings = {
  'zh-CN': { title:'菜单栏与灵动岛设置', heading:'菜单栏与灵动岛', intro:'尺寸使用 macOS 逻辑点，弹窗会限制在屏幕可用区域内。内建屏幕的刘海尺寸由 macOS 读取；没有刘海的旧款 MacBook 会在菜单栏下方显示浮动岛。原生面板不可用时保留菜单栏入口。', window:'窗口', maxWidth:'最大宽度', maxHeight:'最大高度', hideOnBlur:'失焦时收起', hideOnMouseLeave:'鼠标离开窗口时收起', island:'灵动岛', notchHover:'鼠标移到刘海时打开 DSH 主窗口', notchApprovals:'审批以灵动岛卡片显示', compactApprovals:'审批卡片保持在菜单栏内', hideTrayIcon:'隐藏菜单栏图标（需开启悬停入口）', language:'语言', auto:'跟随系统', reset:'恢复默认', preview:'预览审批弹窗', loading:'读取设置中…', waiting:'等待自动保存…', saving:'保存中…', saved:'已自动保存并应用', savedRestart:'已自动保存，重启后生效', newer:'继续保存新更改…', failed:'保存失败：', previewOpened:'预览已打开；点击任一选项可关闭', previewFailed:'预览失败：', ready:'更改将自动保存', readFailed:'读取失败：', range:'超出允许范围' },
  en: { title:'Menu Bar & Island Settings', heading:'Menu Bar & Island', intro:'Sizes use macOS points. The popup stays within the usable display area. macOS provides the built-in notch dimensions; older MacBooks show a floating island below the menu bar. The menu bar entry remains available if the native panel cannot load.', window:'Window', maxWidth:'Maximum width', maxHeight:'Maximum height', hideOnBlur:'Hide when focus is lost', hideOnMouseLeave:'Hide when the pointer leaves the window', island:'Island', notchHover:'Open the DSH window when hovering over the notch', notchApprovals:'Show approvals in the island', compactApprovals:'Keep approval cards inside the menu bar', hideTrayIcon:'Hide menu bar icon (requires hover access)', language:'Language', auto:'Follow system', reset:'Reset defaults', preview:'Preview approval', loading:'Loading settings…', waiting:'Waiting to save…', saving:'Saving…', saved:'Saved and applied', savedRestart:'Saved; restart to apply', newer:'Saving newer changes…', failed:'Save failed: ', previewOpened:'Preview opened; choose any option to close', previewFailed:'Preview failed: ', ready:'Changes save automatically', readFailed:'Could not load settings: ', range:'is out of range' },
}
const systemLanguage = /^zh(?:-|_|$)/i.test(navigator.language || '') ? 'zh-CN' : 'en'
let locale = systemLanguage
const tr = key => strings[locale][key]
function localize() {
  locale = fields.language.value === 'auto' ? systemLanguage : fields.language.value
  document.documentElement.lang = locale
  document.title = tr('title')
  for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = tr(node.dataset.i18n)
  try { localStorage.setItem('dsh-macos-menu-bar-language', fields.language.value) } catch { /* Storage can be disabled. */ }
}
const fields = Object.fromEntries(Object.keys(defaults).map(key =>
  [key, document.querySelector(`[name="${key}"]`)]))
const status = document.getElementById('status')
let ready = false
let revision = 0
let saving = false
let timer

for (const field of Object.values(fields)) field.disabled = true

function show(settings) {
  for (const [key, value] of Object.entries(settings)) {
    if (!fields[key]) continue
    if (fields[key].type === 'checkbox') fields[key].checked = value
    else fields[key].value = value
  }
  localize()
}

function collect() {
  return Object.fromEntries(Object.entries(fields).map(([key, field]) =>
    [key, field.type === 'checkbox' ? field.checked : field.type === 'number' ? Number(field.value) : field.value]))
}

function invalid() {
  for (const [key, field] of Object.entries(fields)) {
    if (field.type === 'number' && (!field.value || !field.checkValidity())) {
      return `${tr(key)} ${tr('range')}`
    }
  }
  return ''
}

function schedule(delay = 0) {
  if (!ready) return
  clearTimeout(timer)
  revision++
  const error = invalid()
  if (error) { status.textContent = error; return }
  status.textContent = tr('waiting')
  timer = setTimeout(save, delay)
}

async function save() {
  if (saving) return
  const error = invalid()
  if (error) { status.textContent = error; return }
  saving = true
  const current = revision
  status.textContent = tr('saving')
  try {
    const response = await fetch('/macos-menu-bar/settings', {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(collect()),
    })
    const saved = await response.json()
    if (!response.ok) throw Error(saved.error || `HTTP ${response.status}`)
    if (revision === current) {
      show(saved)
      status.textContent = response.headers.get('x-dsh-settings-applied') === 'false'
        ? tr('savedRestart') : tr('saved')
    } else status.textContent = invalid() || tr('newer')
  } catch (error) {
    status.textContent = `${tr('failed')}${error.message}`
  } finally {
    saving = false
    if (revision !== current && !invalid()) void save()
  }
}

for (const [key, field] of Object.entries(fields)) {
  if (field.type === 'checkbox') {
    field.addEventListener('change', () => {
      if (key === 'notchHover' && !field.checked) fields.hideTrayIcon.checked = false
      if (key === 'hideTrayIcon' && field.checked) fields.notchHover.checked = true
      if (key === 'notchApprovals' && !field.checked) fields.compactApprovals.checked = false
      if (key === 'compactApprovals' && field.checked) fields.notchApprovals.checked = true
      schedule()
    })
  } else if (field.type === 'number') {
    field.addEventListener('input', () => schedule(450))
    field.addEventListener('change', () => schedule())
  } else field.addEventListener('change', () => { localize(); schedule() })
}

document.getElementById('reset').onclick = () => { show(defaults); schedule() }
document.getElementById('preview').onclick = async () => {
  try {
    const response = await fetch('/macos-menu-bar/preview-approval', { method: 'POST' })
    if (!response.ok) throw Error(`HTTP ${response.status}`)
    status.textContent = tr('previewOpened')
  } catch (error) { status.textContent = `${tr('previewFailed')}${error.message}` }
}

fetch('/macos-menu-bar/settings')
  .then(response => { if (!response.ok) throw Error(`HTTP ${response.status}`); return response.json() })
  .then(settings => {
    show(settings)
    ready = true
    for (const field of Object.values(fields)) field.disabled = false
    document.getElementById('reset').disabled = false
    status.textContent = tr('ready')
  })
  .catch(error => {
    show(defaults)
    ready = true
    for (const field of Object.values(fields)) field.disabled = false
    document.getElementById('reset').disabled = false
    status.textContent = `${tr('readFailed')}${error.message}`
  })
</script></html>
